[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parliament-mcp-india"
version = "1.0.0"
description = "MCP server for India's Parliament: current MPs, committees, and which committee is examining a bill"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
parliament-mcp-india = "parliament_mcp_india.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"parliament_mcp_india" = ["dataset/*.json"]
